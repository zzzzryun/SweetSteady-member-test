<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SWEET STEADY 멤버 매칭 테스트 / メンバーマッチングテスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --vh: 1vh;
    --bg-top:#FFF6EE;
    --bg-bottom:#FDEAF2;
    --surface:#FFFFFF;
    --ink:#2B1B2E;
    --ink-soft:#7A6B7D;
    --primary:#E8517A;
    --primary-soft:#FBE1E8;
    --secondary:#8B7FD1;
    --line:#F1E4E8;
    --member-color:#E8517A;
    --member-color-dark:#E8517A;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow: 0 12px 30px rgba(43,27,46,0.10);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  body{
    display:flex;
    justify-content:center;
    min-height:100dvh;
    min-height:calc(var(--vh) * 100);
  }

  .headline{
    font-family:'Jua','Apple SD Gothic Neo','Hiragino Sans',sans-serif;
    letter-spacing:-0.01em;
  }

  .app{
    width:100%;
    max-width:440px;
    min-height:100dvh;
    min-height:calc(var(--vh) * 100);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }

  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    padding:28px 22px;
    opacity:0;
    transition:opacity .28s ease;
  }
  .screen.active{ display:flex; opacity:1; }

  /* ---------- Start screen ---------- */
  #screen-start{ justify-content:center; text-align:center; }

  .badge{
    align-self:center;
    display:inline-flex;
    padding:6px 16px;
    border-radius:999px;
    background:var(--surface);
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }

  .lang-toggle{
    display:flex; justify-content:center; gap:6px; margin-bottom:22px;
  }
  .lang-btn{
    padding:7px 18px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lang-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .lang-btn:active{ transform:scale(0.96); }

  .start-title{
    font-size:32px;
    line-height:1.35;
    margin:0 0 14px;
    color:var(--ink);
  }

  .start-desc{
    font-size:15px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 26px;
    padding:0 6px;
  }

  .dot-row{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
  }
  .dot{
    width:14px; height:14px; border-radius:50%;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }

  .meta-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }

  .btn-primary{
    display:block;
    width:100%;
    padding:17px 20px;
    border:none;
    border-radius:999px;
    background:var(--primary);
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(232,81,122,0.35);
    transition:transform .12s ease;
  }
  .btn-primary:active{ transform:scale(0.97); }

  .footnote{
    margin-top:22px;
    font-size:11.5px;
    line-height:1.6;
    color:#B7A9BA;
    padding:0 8px;
  }

  /* ---------- Question screen ---------- */
  .q-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:34px;
  }

  .back-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:var(--surface);
    color:var(--ink-soft);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn.hidden{ visibility:hidden; }

  .progress-wrap{ flex:1; }
  .progress-track{
    width:100%;
    height:8px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    background:var(--primary);
    transition:width .3s ease;
  }
  .q-count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    font-weight:600;
  }

  .q-text{
    font-size:22px;
    line-height:1.5;
    margin:0 0 30px;
    color:var(--ink);
    min-height:112px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .option{
    text-align:left;
    padding:18px 18px;
    border-radius:var(--radius-md);
    border:1.5px solid var(--line);
    background:var(--surface);
    font-size:15.5px;
    color:var(--ink);
    line-height:1.5;
    cursor:pointer;
    transition:transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .option:active{ transform:scale(0.98); }
  .option.selected{
    border-color:var(--primary);
    background:var(--primary-soft);
    font-weight:700;
  }

  /* ---------- Result screen ---------- */
  #screen-result{ padding:26px 20px 34px; overflow-y:auto; }

  .result-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:30px 22px 26px;
    position:relative;
    overflow:hidden;
  }
  .result-card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:var(--member-color);
  }

  .result-eyebrow{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    margin:6px 0 18px;
  }

  .avatar-wrap{
    width:112px; height:112px;
    margin:0 auto 16px;
    border-radius:50%;
    border:3px solid var(--member-color);
    padding:3px;
    overflow:hidden;
  }
  .avatar-img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
  }

  .member-name{
    text-align:center;
    font-size:26px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .member-sub{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .member-mbti{
    display:block;
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--member-color-dark);
    margin-bottom:14px;
  }

  .catchphrase{
    text-align:center;
    font-size:15px;
    color:var(--ink);
    padding:14px 12px;
    background:var(--bg-bottom);
    border-radius:var(--radius-sm);
    margin-bottom:22px;
  }

  .match-wrap{ text-align:center; margin-bottom:18px; }
  .match-label{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .match-num{
    font-family:'Jua',sans-serif;
    font-size:52px;
    color:var(--member-color-dark);
    line-height:1;
  }

  .tag-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    margin-bottom:24px;
  }
  .tag-pill{
    font-size:12.5px;
    font-weight:700;
    padding:7px 12px;
    border-radius:999px;
    background:var(--bg-bottom);
    color:var(--member-color-dark);
  }

  .divider{
    height:1px; background:var(--line); margin:22px 0;
  }

  .sec-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 10px;
    color:var(--ink);
  }
  .sec-body{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0;
  }

  .compare-grid{
    display:flex; flex-direction:column; gap:10px;
  }
  .compare-box{
    padding:14px 14px;
    border-radius:var(--radius-sm);
    background:#FAF6F8;
  }
  .compare-box.diff{ background:#F4F2FB; }
  .compare-box p{ margin:4px 0 0; font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .compare-box span{ font-size:12px; font-weight:700; color:var(--ink); }

  .action-row{
    display:flex; gap:10px; margin-top:26px;
  }
  .btn-ghost{
    flex:1;
    padding:14px 8px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-ghost:active{ transform:scale(0.97); }
  .btn-restart{
    display:block;
    width:100%;
    margin-top:12px;
    padding:14px 8px;
    border-radius:999px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .toast{
    position:fixed;
    left:50%; bottom:36px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <!-- ============ START ============ -->
  <section id="screen-start" class="screen active">
    <span class="badge">SWEET STEADY</span>
    <div class="lang-toggle" id="langToggle">
      <button type="button" class="lang-btn active" data-lang="kr">한국어</button>
      <button type="button" class="lang-btn" data-lang="jp">日本語</button>
    </div>
    <h1 class="start-title headline" id="startTitle"></h1>
    <p class="start-desc" id="startDesc"></p>
    <div class="dot-row" id="dotRow"></div>
    <p class="meta-line" id="metaLine"></p>
    <button class="btn-primary" id="startBtn"></button>
    <p class="footnote" id="footnote"></p>
  </section>

  <!-- ============ QUESTION ============ -->
  <section id="screen-question" class="screen">
    <div class="q-top">
      <button class="back-btn hidden" id="backBtn">←</button>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="q-count" id="qCount">01 / 12</div>
      </div>
    </div>
    <h2 class="q-text" id="qText"></h2>
    <div class="options" id="optionsWrap"></div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="screen">
    <div class="result-card" id="resultCard">
      <p class="result-eyebrow" id="rEyebrow"></p>
      <div class="avatar-wrap"><img class="avatar-img" id="rAvatar" alt=""></div>
      <h2 class="member-name headline" id="rName"></h2>
      <p class="member-sub" id="rSub"></p>
      <span class="member-mbti" id="rMbti"></span>
      <p class="catchphrase" id="rCatch"></p>

      <div class="match-wrap">
        <div class="match-label" id="rMatchLabel"></div>
        <div class="match-num headline"><span id="rPct">0</span>%</div>
      </div>
      <div class="tag-row" id="rTags"></div>

      <div class="divider"></div>
      <h3 class="sec-title" id="rYouTitle"></h3>
      <p class="sec-body" id="rYou"></p>

      <div class="divider"></div>
      <h3 class="sec-title" id="rWhyTitle"></h3>
      <p class="sec-body" id="rWhy"></p>

      <div class="divider"></div>
      <div class="compare-grid">
        <div class="compare-box">
          <span id="rSimilarLabel"></span>
          <p id="rSimilar"></p>
        </div>
        <div class="compare-box diff">
          <span id="rDiffLabel"></span>
          <p id="rDiff"></p>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-ghost" id="shareBtn"></button>
        <button class="btn-ghost" id="saveBtn"></button>
      </div>
      <button class="btn-restart" id="restartBtn"></button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

  var restartBtn = document.getElementById('restartBtn');
  var shareBtn = document.getElementById('shareBtn');
  var saveBtn = document.getElementById('saveBtn');
  var toast = document.getElementById('toast');

  /* ---------- helpers ---------- */
  function hexToRgb(hex){
    var h = hex.replace('#','');
    return { r:parseInt(h.substring(0,2),16), g:parseInt(h.substring(2,4),16), b:parseInt(h.substring(4,6),16) };
  }
  function darkenHex(hex, amt){
    var c = hexToRgb(hex);
    var r = Math.max(0, Math.round(c.r*(1-amt)));
    var g = Math.max(0, Math.round(c.g*(1-amt)));
    var b = Math.max(0, Math.round(c.b*(1-amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }
  function showScreen(name){
    Object.keys(screens).forEach(function(key){
      screens[key].classList.toggle('active', key === name);
    });
  }
  function S(){ return STR[state.lang]; }

  /* dot row on start screen */
  members.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'dot';
    d.style.background = m.color;
    dotRow.appendChild(d);
  });

  /* ---------- language handling ---------- */
  function applyStaticText(){
    var s = S();
    document.documentElement.lang = (state.lang === 'kr') ? 'ko' : 'ja';
    startTitleEl.innerHTML = s.startTitle;
    startDescEl.innerHTML = s.startDesc;
    metaLineEl.textContent = s.metaLine;
    startBtn.textContent = s.startBtn;
    footnoteEl.textContent = s.footnote;
    backBtn.setAttribute('aria-label', s.backAria);
    document.getElementById('rEyebrow').textContent = s.resultEyebrow;
    document.getElementById('rMatchLabel').textContent = s.matchLabel;
    document.getElementById('rYouTitle').textContent = s.youTitle;
    document.getElementById('rSimilarLabel').textContent = s.similarLabel;
    document.getElementById('rDiffLabel').textContent = s.diffLabel;
    shareBtn.textContent = s.shareBtn;
    saveBtn.textContent = s.saveBtn;
    restartBtn.textContent = s.restartBtn;
  }

  langToggle.addEventListener('click', function(e){
    var btn = e.target.closest('.lang-btn');
    if (!btn) return;
    var lang = btn.getAttribute('data-lang');
    if (lang === state.lang) return;
    state.lang = lang;
    Array.prototype.forEach.call(langToggle.querySelectorAll('.lang-btn'), function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    applyStaticText();
    if (screens.question.classList.contains('active')) renderQuestion();
    if (screens.result.classList.contains('active')) renderResult();
  });

  /* ---------- question rendering ---------- */
  function renderQuestion(){
    var idx = state.current;
    var q = questions[idx];
    var pct = ((idx+1) / questions.length) * 100;
    progressFill.style.width = pct + '%';
    qCount.textContent = String(idx+1).padStart(2,'0') + ' / ' + questions.length;
    qText.textContent = q.text[state.lang];
    backBtn.classList.toggle('hidden', idx === 0);

    optionsWrap.innerHTML = '';
    q.options.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = opt.text[state.lang];
      if (state.answers[idx] === i) btn.classList.add('selected');
      btn.addEventListener('click', function(){ selectOption(idx, i); });
      optionsWrap.appendChild(btn);
    });
  }

  function selectOption(qIdx, optIdx){
    state.answers[qIdx] = optIdx;
    renderQuestion();
    setTimeout(function(){
      if (qIdx < questions.length - 1){
        state.current = qIdx + 1;
        renderQuestion();
      } else {
        renderResult();
        showScreen('result');
      }
    }, 220);
  }

  backBtn.addEventListener('click', function(){
    if (state.current > 0){
      state.current -= 1;
      renderQuestion();
    }
  });

  startBtn.addEventListener('click', function(){
    state.current = 0;
    state.answers = new Array(questions.length).fill(null);
    renderQuestion();
    showScreen('question');
  });

  restartBtn.addEventListener('click', function(){
    state.current = 0;
    state.answers = new Array(questions.length).fill(null);
    renderQuestion();
    showScreen('start');
  });

  /* ---------- scoring ---------- */
  function computeMaxPerAxis(){
    var max = {};
    AXES.forEach(function(a){ max[a] = 0; });
    questions.forEach(function(q){
      var qMax = {};
      AXES.forEach(function(a){ qMax[a] = 0; });
      q.options.forEach(function(opt){
        AXES.forEach(function(a){
          var v = opt.scores[a] || 0;
          if (v > qMax[a]) qMax[a] = v;
        });
      });
      AXES.forEach(function(a){ max[a] += qMax[a]; });
    });
    return max;
  }

  function computeUserRaw(){
    var raw = {};
    AXES.forEach(function(a){ raw[a] = 0; });
    state.answers.forEach(function(ansIdx, qIdx){
      if (ansIdx === null) return;
      var scores = questions[qIdx].options[ansIdx].scores;
      AXES.forEach(function(a){ raw[a] += (scores[a] || 0); });
    });
    return raw;
  }

  function computeResults(){
    var maxPerAxis = computeMaxPerAxis();
    var raw = computeUserRaw();
    var userNorm = {};
    AXES.forEach(function(a){
      userNorm[a] = maxPerAxis[a] > 0 ? (raw[a] / maxPerAxis[a]) * 10 : 0;
    });

    var maxDist = Math.sqrt(AXES.length * 100);
    var scored = members.map(function(m){
      var sumSq = 0;
      AXES.forEach(function(a){
        var diff = userNorm[a] - m.personality[a];
        sumSq += diff * diff;
      });
      var dist = Math.sqrt(sumSq);
      var pct = 100 - (dist / maxDist) * 100;
      pct = Math.max(5, Math.min(98, Math.round(pct)));
      return { member:m, pct:pct };
    });
    scored.sort(function(a,b){ return b.pct - a.pct; });

    var topAxes = AXES.slice().sort(function(a,b){ return userNorm[b] - userNorm[a]; }).slice(0,3);

    return { scored:scored, userNorm:userNorm, topAxes:topAxes };
  }

  /* ---------- result rendering ---------- */
  function animateCount(el, to, duration){
    var start = null;
    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      el.textContent = Math.round(progress * to);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderResult(){
    var s = S();
    var result = computeResults();
    var top = result.scored[0];
    var m = top.member;
    var lang = state.lang;
    var tp = TRAIT_PHRASE[lang];

    document.documentElement.style.setProperty('--member-color', m.color);
    document.documentElement.style.setProperty('--member-color-dark', darkenHex(m.color, 0.18));

    var avatarImg = document.getElementById('rAvatar');
    avatarImg.src = IMAGES[m.img];
    avatarImg.alt = m.name[lang];

    document.getElementById('rName').textContent = m.name[lang];
    document.getElementById('rSub').textContent = m.sub;
    document.getElementById('rMbti').textContent = m.mbti ? s.mbtiFan(m.mbti) : s.mbtiNone;
    document.getElementById('rCatch').textContent = s.quote(m.catchphrase[lang]);

    var pctEl = document.getElementById('rPct');
    pctEl.textContent = '0';
    animateCount(pctEl, top.pct, 900);

    var tagWrap = document.getElementById('rTags');
    tagWrap.innerHTML = '';
    m.tags[lang].forEach(function(t){
      var span = document.createElement('span');
      span.className = 'tag-pill';
      span.textContent = t;
      tagWrap.appendChild(span);
    });

    var youText = s.youText(tp[result.topAxes[0]], tp[result.topAxes[1]], tp[result.topAxes[2]]);
    document.getElementById('rYou').textContent = youText;

    document.getElementById('rWhyTitle').textContent = s.whyTitle(m.name[lang]);
    document.getElementById('rWhy').textContent = s.whyText(m.whyBase[lang], tp[result.topAxes[0]]);

    document.getElementById('rSimilar').textContent = m.similar[lang].join(' ');
    document.getElementById('rDiff').textContent = m.diff[lang];

    window.__lastResult = { member:m, pct:top.pct };
  }

  /* ---------- share & save ---------- */
  shareBtn.addEventListener('click', function(){
    var r = window.__lastResult;
    if (!r) return;
    var s = S();
    var text = s.shareText(r.member.name[state.lang], r.pct);
    if (navigator.share){
      navigator.share({ title:s.shareTitle, text:text, url:location.href }).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text + ' ' + location.href).then(function(){
        showToast(s.toastCopied);
      }).catch(function(){ showToast(s.toastCopyFail); });
    } else {
      showToast(s.toastNoShare);
    }
  });

  saveBtn.addEventListener('click', function(){
    var s = S();
    if (typeof html2canvas === 'function'){
      html2canvas(document.getElementById('resultCard'), { backgroundColor:'#ffffff', scale:2 }).then(function(canvas){
        var link = document.createElement('a');
        link.download = 'sweet-steady-result.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(function(){
        showToast(s.toastSaveFail);
      });
    } else {
      showToast(s.toastNoSave);
    }
  });

  /* ---------- init ---------- */
  applyStaticText();

})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</body>
